name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: 固件编译 (ESP-IDF v6.0.3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git describe 生成版本号需要完整历史和 tag
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32c3
          # command 默认就是 idf.py build。注意：action 会把 command 包进一对单引号里，
          # 并且已经自己配置了 git safe.directory，所以 command 里不能再出现单引号
      - uses: actions/upload-artifact@v6
        with:
          name: firmware
          path: |
            build/c3-weather-clock.bin
            build/c3-weather-clock.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json

  host-tests:
    name: L1 单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash tools/host-test.sh

  sim:
    name: 模拟器截图
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: bash tools/sim.sh shot
      - uses: actions/upload-artifact@v6
        with:
          name: sim-shots
          path: build-sim/shots/
